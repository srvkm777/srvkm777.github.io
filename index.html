<!DOCTYPE html>
<html>
<head>
  <title>Utkal Greenex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --green: #2e7d5b;
      --light: #f4f7f5;
      --card: #ffffff;
      --dark: #121212;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: var(--light);
      padding-bottom: 80px;
    }

    body.dark {
      background: var(--dark);
      color: white;
    }

    /* ✅ HEADER */
    .header {
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      z-index: 1000;
    }

    body.dark .header {
      background: rgba(20,20,20,0.9);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 32px;
      height: 32px;
    }

    h3 {
      margin: 0;
      font-size: 16px;
    }

    /* ✅ GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 10px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
      transition: transform 0.15s ease;
    }

    body.dark .card {
      background: #1e1e1e;
    }

    .card:active {
      transform: scale(0.95);
    }

    .card span {
      font-size: 22px;
      display: block;
    }

    .card small {
      font-size: 12px;
      color: gray;
    }

    /* ✅ SECTION */
    h2 {
      padding: 0 12px;
      color: var(--green);
      margin: 10px 0;
    }

    /* ✅ ACTION CARD */
    .action-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px;
      padding: 14px;
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
      transition: transform 0.15s;
    }

    body.dark .action-card {
      background: #1e1e1e;
    }

    .action-card:active {
      transform: scale(0.97);
    }

    .action-left {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .action-info {
      display: flex;
      flex-direction: column;
    }

    .action-name {
      font-weight: 600;
    }

    .action-desc {
      font-size: 12px;
      color: gray;
    }

    /* ✅ BOTTOM NAV */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      background: white;
      padding: 10px 0;
      border-top: 1px solid #ddd;
    }

    body.dark .bottom-bar {
      background: #1e1e1e;
    }

    .bottom-bar div {
      text-align: center;
      font-size: 12px;
    }

    .bottom-bar div:active {
      transform: scale(0.9);
    }

    .bottom-bar span {
      display: block;
      font-size: 10px;
    }

  </style>
</head>

<body>

<!-- ✅ HEADER -->
<div class="header">
  <div class="logo-wrap">
    utkalgreenexlogi.png">
    <h3>Utkal Greenex</h3>
  </div>
  <button onclick="toggleDark()">🌙</button>
</div>

<p id="status" style="padding:10px;">Detecting location...</p>

<!-- ✅ GRID -->
<div class="grid">
  <div class="card" onclick="searchPlaces('hospital')">🏥<small>Hospital</small></div>
  <div class="card" onclick="searchPlaces('pharmacy')">💊<small>Pharmacy</small></div>
  <div class="card" onclick="searchPlaces('supermarket')">🛒<small>Grocery</small></div>
  <div class="card" onclick="searchPlaces('atm')">🏧<small>ATM</small></div>
  <div class="card" onclick="searchPlaces('bank')">₹<small>Bank</small></div>
  <div class="card" onclick="searchPlaces('24 hour pharmacy')">🌙<small>24x7</small></div>
</div>

<h2>📢 Society Services</h2>

<div class="action-card" onclick="openOhhPro()">
  <div class="action-left">
    ohhpro.png">
    <div class="action-info">
      <span class="action-name">OhhPro Junction</span>
      <span class="action-desc">Complaints & emergencies</span>
    </div>
  </div>
  ➡️
</div>

<div class="action-card" onclick="openWhatsApp()">
  <div class="action-left">
    💬
    <div class="action-info">
      <span class="action-name">WhatsApp Group</span>
      <span class="action-desc">Society updates</span>
    </div>
  </div>
  📱
</div>

<script>

let latitude, longitude, areaName="";

navigator.geolocation.getCurrentPosition(pos=>{
  latitude=pos.coords.latitude;
  longitude=pos.coords.longitude;
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`)
  .then(r=>r.json()).then(d=>{
    areaName=d.address.suburb||d.address.city;
    document.getElementById("status").innerText="📍 "+areaName;
  });
});

function searchPlaces(type){
  window.open(`https://www.google.com/maps/search/${type}+near+${areaName}`);
}

/* ✅ PREMIUM APP OPEN */
function openApp(type){
  let map={
    uber:["uber://","https://m.uber.com"],
    ola:["olacabs://","https://book.olacabs.com"],
    swiggy:["swiggy://","https://swiggy.com"],
    zomato:["zomato://","https://zomato.com"],
    blinkit:["blinkit://","https://blinkit.com"],
    bigbasket:["bbnow://","https://bigbasket.com"],
    ohhpro:["ohhpro://","https://apps.apple.com/se/app/ohhpro-junction/id1596785670"]
  };

  let [scheme,fallback]=map[type];

  let iframe=document.createElement("iframe");
  iframe.style.display="none";
  iframe.src=scheme;
  document.body.appendChild(iframe);

  setTimeout(()=>window.location.href=fallback,1500);
}

function openOhhPro(){openApp("ohhpro");}
function openWhatsApp(){window.location.href="https://wa.me/";}

function toggleDark(){
  document.body.classList.toggle("dark");
}

</script>

<!-- ✅ NAV -->
<div class="bottom-bar">
  <div onclick="openApp('uber')">🚕<span>Uber</span></div>
  <div onclick="openApp('ola')">🚗<span>Ola</span></div>
  <div onclick="openApp('swiggy')">🍔<span>Swiggy</span></div>
  <div onclick="openApp('zomato')">🍕<span>Zomato</span></div>
  <div onclick="openApp('blinkit')">🛒<span>Blinkit</span></div>
  <div onclick="openApp('bigbasket')">🧺<span>BB</span></div>
</div>

</body>
</html>
