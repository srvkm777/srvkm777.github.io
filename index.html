<!DOCTYPE html>
<html>
<head>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d5b">

  <title>Utkal Greenex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --green: #2e7d5b;
      --light: #f4f7f5;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--light);
      padding-bottom: 80px;
    }

    /* HEADER */
    .header {
      position: sticky;
      top: 0;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #2e7d5b, #3ea97c);
      color: white;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      background: white;
      padding: 4px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 12px;
    }

    .card {
      background: white;
      padding: 14px;
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
    }

    .card span { font-size: 22px; }
    .card small { display:block; margin-top:6px; }

    h2 {
      padding-left: 12px;
      color: var(--green);
    }

    /* ACTION CARDS */
    .action-card {
      margin: 10px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 16px;
      background: white;
      cursor: pointer;
    }

    .action-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .small-logo {
      width: 30px;
      height: 30px;
    }

    /* BOTTOM NAV */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      background: white;
      padding: 10px 0;
      border-top: 1px solid #ddd;
    }

    .bottom-bar div {
      text-align: center;
      font-size: 12px;
      cursor: pointer;
    }

    .bottom-bar span {
      display: block;
      font-size: 10px;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo-wrap">
    <img src="utkalgreenexlogi.png" class="logo">
    <div class="title">Utkal Greenex Directory</div>
  </div>
  <button onclick="toggleDark()">🌙</button>
</div>

<!-- STATIC LOCATION -->
<p style="padding:10px;">
📍 Utkal Greenex,Sunderpada,Bhubaneswar
</p>

<!-- SEARCH GRID -->
<div class="grid">
  <div class="card" onclick="searchPlaces('hospital')">🏥<small>Hospital</small></div>
  <div class="card" onclick="searchPlaces('pharmacy')">💊<small>Pharmacy</small></div>
  <div class="card" onclick="searchPlaces('supermarket')">🛒<small>Grocery</small></div>
  <div class="card" onclick="searchPlaces('atm')">🏧<small>ATM</small></div>
  <div class="card" onclick="searchPlaces('bank')">₹<small>Bank</small></div>
  <div class="card" onclick="searchPlaces('restaurant')">🍽<small>Food</small></div>
  <div class="card" onclick="searchPlaces('vegetable market')">🥦<small>Veg</small></div>
  <div class="card" onclick="searchPlaces('chicken shop')">🍗<small>Meat</small></div>
  <div class="card" onclick="openLocation()">📍<small>Directions</small></div>
</div>

<!-- SERVICES -->
<h2>📢 Society Services</h2>

<div class="action-card" onclick="openOhhPro()">
  <div class="action-left">
    <img src="ohhpro.png" class="small-logo">
    <div>OhhPro Junction</div>
  </div>
</div>

<div class="action-card" onclick="openWhatsApp()">
  <div class="action-left">
    💬 WhatsApp Group
  </div>
</div>

<div class="action-card" onclick="openSuggestion()">
  <div class="action-left">
    💡 Suggest Improvement
  </div>
</div>

<!-- DOCUMENTS -->
<h2>📄 Documents</h2>

<div class="grid">
  <div class="card" onclick="openDoc('docs/bylaws/bylaws.pdf')">📜<small>Bylaws</small></div>
  <div class="card" onclick="openDoc('docs/bylaws/meetings/2026-may.pdf')">📝<small>Latest MoM</small></div>
  <div class="card" onclick="openDoc('docs/bylaws/meetings/2026-may.pdf')">📝<small>Notice</small></div>
</div>

<script>

/* ✅ BETTER MAP SEARCH (MULTIPLE RESULTS) */
function searchPlaces(type){
  const lat = 20.2469;
  const lon = 85.8189;
  window.open(`https://www.google.com/maps/search/${type}/@${lat},${lon},15z`);
}

/* ✅ OPEN LOCATION */
function openLocation(){
  window.open("https://maps.app.goo.gl/urxJ4ayd5iEdCkiS9");
}

/* ✅ OPEN DOC */
function openDoc(path){
  window.open(path, "_blank");
}

/* ✅ APP OPEN */
function openApp(type){
  const map={
    uber:["uber://","https://m.uber.com"],
    ola:["olacabs://","https://book.olacabs.com"],
    swiggy:["swiggy://","https://www.swiggy.com"],
    zomato:["zomato://","https://www.zomato.com"],
    blinkit:["blinkit://","https://blinkit.com"],
    ohhpro:["ohhpro://","https://apps.apple.com/se/app/ohhpro-junction/id1596785670"]
  };

  const [scheme,fallback]=map[type];

  const iframe=document.createElement("iframe");
  iframe.style.display="none";
  iframe.src=scheme;
  document.body.appendChild(iframe);

  setTimeout(()=>{
    if(!document.hidden){
      window.location.href=fallback;
    }
  },1500);
}

function openOhhPro(){openApp("ohhpro");}

function openWhatsApp(){
  window.location.href="https://wa.me/";
}

/* ✅ SUGGESTION FUNCTION (ADDED BACK ✅) */
function openSuggestion() {
  window.open("https://docs.google.com/forms/d/e/1FAIpQLSeTnjEctE_DHkD5IZjsq7ukjiwVuckEDHlOizHf9352blUzSg/viewform?usp=publish-editor");
}

function toggleDark(){
  document.body.classList.toggle("dark");
}

</script>

<!-- ✅ FULL APP NAV RESTORED -->
<div class="bottom-bar">
  <div onclick="openApp('uber')">🚕<span>Uber</span></div>
  <div onclick="openApp('ola')">🚗<span>Ola</span></div>
  <div onclick="openApp('swiggy')">🍔<span>Swiggy</span></div>
  <div onclick="openApp('zomato')">🍕<span>Zomato</span></div>
  <div onclick="openApp('blinkit')">🛒<span>Blinkit</span></div>
</div>

</body>
</html>
