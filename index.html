<!DOCTYPE html>
<html>
<head>
  <title>Utkal Greenex - Yellow Pages</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 10px;
      padding-bottom: 80px;
      background: #f5f5f5;
    }

    body.dark {
      background: #121212;
      color: white;
    }

    h2 { margin-top: 15px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card {
      padding: 15px;
      text-align: center;
      border-radius: 12px;
      background: white;
      cursor: pointer;
    }

    body.dark .card { background: #1e1e1e; }

    .card span {
      display: block;
      font-size: 24px;
    }

    .action-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      margin: 10px 0;
      border-radius: 12px;
      background: white;
      cursor: pointer;
    }

    body.dark .action-card { background: #1e1e1e; }

    .action-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 28px;
      height: 28px;
    }

    .action-info {
      display: flex;
      flex-direction: column;
    }

    .action-name { font-weight: bold; }

    .action-desc {
      font-size: 12px;
      color: gray;
    }

    .icon { font-size: 20px; }

    /* ✅ Bottom nav */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      background: white;
      padding: 8px 0;
      border-top: 1px solid #ddd;
    }

    body.dark .bottom-bar {
      background: #1e1e1e;
      border-top: 1px solid #333;
    }

    .bottom-bar div {
      text-align: center;
      font-size: 12px;
      cursor: pointer;
    }

    .bottom-bar span {
      display: block;
      font-size: 10px;
    }

  </style>
</head>

<body>

<div class="topbar">
  <h2>🏢 Utkal Greenex</h2>
  <button onclick="toggleDark()">🌙</button>
</div>

<p id="status">Detecting location...</p>

<!-- GRID -->
<div class="grid">
  <div class="card" onclick="searchPlaces('hospital')"><span>🏥</span>Hospital</div>
  <div class="card" onclick="searchPlaces('pharmacy')"><span>💊</span>Pharmacy</div>
  <div class="card" onclick="searchPlaces('supermarket')"><span>🛒</span>Grocery</div>
  <div class="card" onclick="searchPlaces('atm')"><span>🏧</span>ATM</div>
  <div class="card" onclick="searchPlaces('bank')"><span>₹</span>Bank</div>
  <div class="card" onclick="searchPlaces('24 hour pharmacy')"><span>🌙</span>24x7</div>
  <div class="card" onclick="searchPlaces('chicken & meat shop')"><span>🍗</span>Meat</div>
  <div class="card" onclick="sendDirections()"><span>📍</span>Share</div>
</div>

<h2>📢 Society Services</h2>

<!-- ✅ OhhPro -->
<div class="action-card" onclick="openOhhPro()">
  <div class="action-left">
    <img src="ohhpro.png" class="logo">
    <div class="action-info">
      <span class="action-name">OhhPro Junction</span>
      <span class="action-desc">Complaints, requests & emergencies</span>
    </div>
  </div>
  <div class="icon">➡️</div>
</div>

<!-- ✅ WhatsApp -->
<div class="action-card" onclick="openWhatsApp()">
  <div class="action-left">
    <span>💬</span>
    <div class="action-info">
      <span class="action-name">Open WhatsApp</span>
      <span class="action-desc">Open society group</span>
    </div>
  </div>
  <div class="icon">📱</div>
</div>

<!-- ✅ Suggest -->
<div class="action-card" onclick="openSuggestion()">
  <div class="action-left">
    <span>💡</span>
    <div class="action-info">
      <span class="action-name">Suggest Improvement</span>
      <span class="action-desc">Send feedback</span>
    </div>
  </div>
  <div class="icon">✉️</div>
</div>

<script>

let latitude, longitude, areaName = "";

/* LOCATION */
navigator.geolocation.getCurrentPosition(
  pos => {
    latitude = pos.coords.latitude;
    longitude = pos.coords.longitude;

    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`)
      .then(res => res.json())
      .then(data => {
        areaName = data.address.suburb || data.address.city || "your area";
        document.getElementById("status").innerText = "📍 " + areaName;
      });
  }
);

/* SEARCH */
function searchPlaces(type) {
  window.open(`https://www.google.com/maps/search/${type}+near+${areaName}`);
}

/* ✅ FIXED APP OPEN (BOTTOM NAV WORKING NOW) */
function openApp(type) {
  let scheme = "", fallback = "";

  if (type === "uber") {
    scheme = "uber://";
    fallback = "https://m.uber.com";
  } else if (type === "ola") {
    scheme = "olacabs://";
    fallback = "https://book.olacabs.com";
  } else if (type === "swiggy") {
    scheme = "swiggy://";
    fallback = "https://www.swiggy.com";
  } else if (type === "zomato") {
    scheme = "zomato://";
    fallback = "https://www.zomato.com";
  } else if (type === "blinkit") {
    scheme = "blinkit://";
    fallback = "https://blinkit.com";
  } else if (type === "bigbasket") {
    scheme = "bbnow://";
    fallback = "https://www.bigbasket.com";
  }

  window.location.href = scheme;

  setTimeout(() => {
    window.location.href = fallback;
  }, 1200);
}

/* ✅ OHHPRO (FIXED WITH YOUR iOS LINK) */
function openOhhPro() {
  const ua = navigator.userAgent;

  if (/android/i.test(ua)) {
    window.location.href = "intent://#Intent;package=com.ohhpro.junction;end";

    setTimeout(() => {
      window.location.href =
        "https://play.google.com/store/apps/details?id=com.ohhpro.junction";
    }, 1200);

  } else if (/iPhone|iPad|iPod/i.test(ua)) {
    window.location.href =
      "https://apps.apple.com/se/app/ohhpro-junction/id1596785670?l=en-GB";
  }
}

/* ✅ WHATSAPP (FIXED FOR BOTH) */
function openWhatsApp() {
  const ua = navigator.userAgent;

  if (/android/i.test(ua)) {
    window.location.href = "intent://send/#Intent;scheme=whatsapp;package=com.whatsapp;end;";
  } else {
    window.location.href = "https://wa.me/";
  }
}

/* ✅ SUGGEST */
function openSuggestion() {
  window.open("https://forms.gle/YOUR_FORM_LINK");
}

/* SHARE */
function sendDirections() {
  const link = `https://www.google.com/maps?q=${latitude},${longitude}`;
  navigator.clipboard.writeText(link);
  alert("Location copied!");
}

/* DARK MODE */
function toggleDark() {
  document.body.classList.toggle("dark");
}

</script>

<!-- ✅ BOTTOM NAV -->
<div class="bottom-bar">
  <div onclick="openApp('uber')">🚕<span>Uber</span></div>
  <div onclick="openApp('ola')">🚗<span>Ola</span></div>
  <div onclick="openApp('swiggy')">🍔<span>Swiggy</span></div>
  <div onclick="openApp('zomato')">🍕<span>Zomato</span></div>
  <div onclick="openApp('blinkit')">🛒<span>Blinkit</span></div>
  <div onclick="openApp('bigbasket')">🧺<span>BB</span></div>
</div>

</body>
</html>
