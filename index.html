<!DOCTYPE html>
<html>
<head>
  <title>Utkal Greenex - Yellow Pages</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 10px;
      background: #f5f5f5;
      color: #000;
    }

    body.dark {
      background: #121212;
      color: #fff;
    }

    h2 {
      margin-top: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card {
      padding: 15px;
      text-align: center;
      border-radius: 12px;
      background: white;
      cursor: pointer;
    }

    body.dark .card {
      background: #1e1e1e;
    }

    .card span {
      display: block;
      font-size: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    input {
      padding: 8px;
      width: 100%;
      margin: 5px 0;
    }
  </style>
</head>

<body>

<div class="topbar">
  <h2>🏢 Apartment</h2>
  <button onclick="toggleDark()">🌙</button>
</div>

<p id="status">Detecting location...</p>

<!-- GRID UI -->
<div class="grid">

  <div class="card" onclick="searchPlaces('hospital')">
    <span>🏥</span> Hospital
  </div>

  <div class="card" onclick="searchPlaces('pharmacy')">
    <span>💊</span> Pharmacy
  </div>

  <div class="card" onclick="searchPlaces('supermarket')">
    <span>🛒</span> Grocery
  </div>

  <div class="card" onclick="searchPlaces('stationery')">
    <span>📚</span> Stationery
  </div>

  <div class="card" onclick="searchPlaces('atm')">
    <span>🏧</span> ATM
  </div>

  <div class="card" onclick="searchPlaces('24 hour pharmacy')">
    <span>🌙</span> 24x7
  </div>

  <div class="card" onclick="openApp('https://www.swiggy.com')">
    <span>🍔</span> Swiggy
  </div>

  <div class="card" onclick="openApp('https://www.zomato.com')">
    <span>🍕</span> Zomato
  </div>

  <div class="card" onclick="sendDirections()">
    <span>📍</span> Share Loc
  </div>

</div>

<!-- CONTACTS -->
<h2>📞 Contacts (Editable)</h2>

<div id="contacts"></div>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<button onclick="addContact()">➕ Add Contact</button>

<script>
let latitude, longitude, areaName = "";

// ✅ LOCATION
navigator.geolocation.getCurrentPosition(
  (pos) => {
    latitude = pos.coords.latitude;
    longitude = pos.coords.longitude;
    getAreaName();
  },
  () => {
    document.getElementById("status").innerText = "Enable location";
  }
);

function getAreaName() {
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`)
    .then(res => res.json())
    .then(data => {
      areaName = data.address.suburb || data.address.city;
      document.getElementById("status").innerText = "📍 " + areaName;
    });
}

// ✅ SEARCH
function searchPlaces(type) {
  const url = `https://www.google.com/maps/search/${type}+near+${areaName}`;
  window.open(url, "_blank");
}

// ✅ APPS
function openApp(url) {
  window.open(url);
}

// ✅ LOCATION SHARE
function sendDirections() {
  const link = `https://www.google.com/maps?q=${latitude},${longitude}`;
  navigator.clipboard.writeText(link);
  alert("Location copied!");
}

// 🌙 DARK MODE
function toggleDark() {
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", document.body.classList.contains("dark"));
}

// restore dark mode
if (localStorage.getItem("dark") === "true") {
  document.body.classList.add("dark");
}

// ✅ CONTACT STORAGE
function loadContacts() {
  const data = JSON.parse(localStorage.getItem("contacts") || "[]");
  const el = document.getElementById("contacts");
  el.innerHTML = "";

  data.forEach((c, i) => {
    el.innerHTML += `
      <div class="card">
        ${c.name} 
        <br>
        <a href="tel
        <button onclick="deleteContact(${i})">❌</button>
      </div>
    `;
  });
}

function addContact() {
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;

  const data = JSON.parse(localStorage.getItem("contacts") || "[]");
  data.push({ name, phone });

  localStorage.setItem("contacts", JSON.stringify(data));

  loadContacts();
}

function deleteContact(i) {
  let data = JSON.parse(localStorage.getItem("contacts"));
  data.splice(i, 1);
  localStorage.setItem("contacts", JSON.stringify(data));
  loadContacts();
}

loadContacts();
</script>

</body>
</html>
