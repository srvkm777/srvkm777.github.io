<!DOCTYPE html>
<html>
<head>
  <title>Utkal Greenex - Yellow Pages</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 10px;
      padding-bottom: 80px;
      background: #f5f5f5;
      color: #000;
    }

    body.dark {
      background: #121212;
      color: #fff;
    }

    h2 { margin-top: 15px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card {
      padding: 15px;
      text-align: center;
      border-radius: 12px;
      background: white;
      cursor: pointer;
    }

    body.dark .card {
      background: #1e1e1e;
    }

    .card span {
      display: block;
      font-size: 24px;
    }

    /* ✅ CONTACT CARD = FULL CLICKABLE */
    .contact-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      margin: 8px 0;
      border-radius: 12px;
      background: white;

      text-decoration: none;
      color: inherit;
    }

    body.dark .contact-card {
      background: #1e1e1e;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
    }

    .contact-name {
      font-weight: bold;
      font-size: 15px;
    }

    .contact-phone {
      font-size: 12px;
      color: gray;
    }

    .call-icon {
      font-size: 20px;
    }

    /* ✅ BOTTOM NAV */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      border-top: 1px solid #ddd;
    }

    body.dark .bottom-bar {
      background: #1e1e1e;
    }

    .bottom-bar div {
      text-align: center;
      font-size: 12px;
      cursor: pointer;
    }

    .bottom-bar span {
      display: block;
      font-size: 10px;
    }

  </style>
</head>

<body>

<div class="topbar">
  <h2>🏢 Utkal Greenex</h2>
  <button onclick="toggleDark()">🌙</button>
</div>

<p id="status">Detecting location...</p>

<!-- GRID -->
<div class="grid">
  <div class="card" onclick="searchPlaces('hospital')"><span>🏥</span>Hospital</div>
  <div class="card" onclick="searchPlaces('pharmacy')"><span>💊</span>Pharmacy</div>
  <div class="card" onclick="searchPlaces('supermarket')"><span>🛒</span>Grocery</div>
  <div class="card" onclick="searchPlaces('stationery')"><span>📚</span>Stationery</div>
  <div class="card" onclick="searchPlaces('atm')"><span>🏧</span>ATM</div>
  <div class="card" onclick="searchPlaces('24 hour pharmacy')"><span>🌙</span>24x7</div>
  <div class="card" onclick="searchPlaces('bank')"><span>₹</span>Bank</div>
  <div class="card" onclick="searchPlaces('chicken & meat shop')"><span>🍗</span>Meat</div>
  <div class="card" onclick="sendDirections()"><span>📍</span>Share</div>
</div>

<!-- ✅ CONTACTS (FULL CLICKABLE) -->
<h2>📞 Important Contacts</h2>

<a href="tel:+919900000001" class="contact-card">
  <div class="contact-info">
    <span class="contact-name">🛡 Security</span>
    <span class="contact-phone">+91 9900000001</span>
  </div>
  <div class="call-icon">📞</div>
</a>

<a href="tel:+919900000002" class="contact-card">
  <div class="contact-info">
    <span class="contact-name">🛠 Maintenance</span>
    <span class="contact-phone">+91 9900000002</span>
  </div>
  <div class="call-icon">📞</div>
</a>

<a href="tel:100" class="contact-card">
  <div class="contact-info">
    <span class="contact-name">🚨 Police</span>
    <span class="contact-phone">100</span>
  </div>
  <div class="call-icon">📞</div>
</a>

<a href="tel:102" class="contact-card">
  <div class="contact-info">
    <span class="contact-name">🚑 Ambulance</span>
    <span class="contact-phone">102</span>
  </div>
  <div class="call-icon">📞</div>
</a>

<a href="tel:101" class="contact-card">
  <div class="contact-info">
    <span class="contact-name">🔥 Fire</span>
    <span class="contact-phone">101</span>
  </div>
  <div class="call-icon">📞</div>
</a>

<script>
let latitude, longitude, areaName = "";

/* LOCATION */
navigator.geolocation.getCurrentPosition(
  pos => {
    latitude = pos.coords.latitude;
    longitude = pos.coords.longitude;
    getAreaName();
  },
  () => {
    document.getElementById("status").innerText = "Enable location";
  }
);

function getAreaName() {
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`)
    .then(res => res.json())
    .then(data => {
      areaName = data.address.suburb || data.address.city || "your area";
      document.getElementById("status").innerText = "📍 " + areaName;
    });
}

/* SEARCH */
function searchPlaces(type) {
  const url = `https://www.google.com/maps/search/${type}+near+${areaName}`;
  window.open(url);
}

/* ✅ APP DEEP LINK */
function openApp(type) {
  let scheme='', fallback='';

  if (type==='uber'){ scheme='uber://'; fallback='https://m.uber.com';}
  if (type==='ola'){ scheme='olacabs://'; fallback='https://book.olacabs.com';}
  if (type==='swiggy'){ scheme='swiggy://'; fallback='https://www.swiggy.com';}
  if (type==='zomato'){ scheme='zomato://'; fallback='https://www.zomato.com';}
  if (type==='blinkit'){ scheme='blinkit://'; fallback='https://blinkit.com';}
  if (type==='bigbasket'){ scheme='bbnow://'; fallback='https://www.bigbasket.com';}

  window.location.href = scheme;
  setTimeout(()=>window.location.href=fallback,1200);
}

/* SHARE LOCATION */
function sendDirections() {
  const link = `https://www.google.com/maps?q=${latitude},${longitude}`;
  navigator.clipboard.writeText(link);
  alert("Location copied!");
}

/* DARK MODE */
function toggleDark() {
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", document.body.classList.contains("dark"));
}

if (localStorage.getItem("dark") === "true") {
  document.body.classList.add("dark");
}
</script>

<!-- ✅ BOTTOM NAV -->
<div class="bottom-bar">
  <div onclick="openApp('uber')">🚕<span>Uber</span></div>
  <div onclick="openApp('ola')">🚗<span>Ola</span></div>
  <div onclick="openApp('swiggy')">🍔<span>Swiggy</span></div>
  <div onclick="openApp('zomato')">🍕<span>Zomato</span></div>
  <div onclick="openApp('blinkit')">🛒<span>Blinkit</span></div>
  <div onclick="openApp('bigbasket')">🧺<span>BB</span></div>
</div>

</body>
</html>
