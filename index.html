<!DOCTYPE html>
<html>
<head>
  <title>Local Yellow Pages</title>

  <!-- ✅ Mobile friendly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      margin: 15px;
    }

    h1 {
      text-align: center;
    }

    button {
      margin: 8px 0;
      padding: 12px;
      width: 100%;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #007bff;
      color: white;
    }

    button:hover {
      background: #0056b3;
    }

    .info {
      margin-top: 10px;
      font-size: 14px;
      color: gray;
    }
  </style>
</head>

<body>

<h1>📍 My Local Yellow Pages</h1>

<p id="status">Detecting your location...</p>

<div>
  <button onclick="searchPlaces('hospital')">🏥 Hospitals</button>
  <button onclick="searchPlaces('pharmacy')">💊 Pharmacy</button>
  <button onclick="searchPlaces('supermarket')">🛒 Grocery</button>
  <button onclick="searchPlaces('stationery')">📚 Stationery</button>
</div>

<p class="info">Opens results directly in Google Maps ✅</p>

<script>
let latitude, longitude;
let areaName = "";

// ✅ Get user location
navigator.geolocation.getCurrentPosition(
  (pos) => {
    latitude = pos.coords.latitude;
    longitude = pos.coords.longitude;

    document.getElementById("status").innerText = "📍 Getting area name...";
    getAreaName();
  },
  (err) => {
    document.getElementById("status").innerText =
      "❌ Please allow location access.";
    console.error(err);
  }
);

// ✅ Convert lat/lon to readable area
function getAreaName() {
  const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`;

  fetch(url)
    .then(res => res.json())
    .then(data => {
      const addr = data.address;

      areaName =
        addr.suburb ||
        addr.neighbourhood ||
        addr.city ||
        addr.town ||
        addr.village ||
        "your area";

      document.getElementById("status").innerText =
        "✅ Location detected: " + areaName;
    })
    .catch(() => {
      areaName = latitude + "," + longitude;
      document.getElementById("status").innerText =
        "✅ Location detected";
    });
}

// ✅ Open Google Maps search
function searchPlaces(type) {
  if (!latitude || !longitude) {
    alert("Waiting for location...");
    return;
  }

  document.getElementById("status").innerText =
    "Opening Google Maps...";

  let query;

  if (areaName) {
    query = `${type} near ${areaName}`;
  } else {
    query = `${type} near ${latitude},${longitude}`;
  }

  const url = `https://www.google.com/maps/search/${encodeURIComponent(query)}`;

  window.open(url, "_blank");
}
</script>

</body>
</html>
