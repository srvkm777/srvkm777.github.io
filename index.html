<!DOCTYPE html>
<html>
<head>
  <title>Utkal Greenex - Yellow Pages</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 10px;
      padding-bottom: 80px;
      background: #f5f5f5;
    }

    body.dark {
      background: #121212;
      color: white;
    }

    h2 { margin-top: 15px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card {
      padding: 15px;
      text-align: center;
      border-radius: 12px;
      background: white;
      cursor: pointer;
    }

    body.dark .card { background: #1e1e1e; }

    .card span {
      display: block;
      font-size: 24px;
    }

    /* ACTION CARDS */
    .action-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      margin: 10px 0;
      border-radius: 12px;
      background: white;
      cursor: pointer;
    }

    body.dark .action-card {
      background: #1e1e1e;
    }

    .action-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 28px;
      height: 28px;
    }

    .action-info {
      display: flex;
      flex-direction: column;
    }

    .action-name {
      font-weight: bold;
    }

    .action-desc {
      font-size: 12px;
      color: gray;
    }

    .icon {
      font-size: 20px;
    }

  </style>
</head>

<body>

<div class="topbar">
  <h2>🏢 Utkal Greenex</h2>
  <button onclick="toggleDark()">🌙</button>
</div>

<p id="status">Detecting location...</p>

<!-- GRID -->
<div class="grid">
  <div class="card" onclick="searchPlaces('hospital')"><span>🏥</span>Hospital</div>
  <div class="card" onclick="searchPlaces('pharmacy')"><span>💊</span>Pharmacy</div>
  <div class="card" onclick="searchPlaces('supermarket')"><span>🛒</span>Grocery</div>
  <div class="card" onclick="searchPlaces('atm')"><span>🏧</span>ATM</div>
  <div class="card" onclick="searchPlaces('bank')"><span>₹</span>Bank</div>
  <div class="card" onclick="searchPlaces('24 hour pharmacy')"><span>🌙</span>24x7</div>
  <div class="card" onclick="searchPlaces('chicken & meat shop')"><span>🍗</span>Meat</div>
  <div class="card" onclick="sendDirections()"><span>📍</span>Share</div>
</div>

<!-- SERVICES -->
<h2>📢 Society Services</h2>

<!-- ✅ OhhPro -->
<div class="action-card" onclick="openOhhPro()">
  <div class="action-left">
    <img src="ohhpro.png" class="logo">
    <div class="action-info">
      <span class="action-name">OhhPro Junction</span>
      <span class="action-desc">Complaints, requests & emergencies</span>
    </div>
  </div>
  <div class="icon">➡️</div>
</div>

<!-- ✅ WhatsApp -->
<div class="action-card" onclick="openWhatsApp()">
  <div class="action-left">
    <span>💬</span>
    <div class="action-info">
      <span class="action-name">Open WhatsApp</span>
      <span class="action-desc">Go to society group</span>
    </div>
  </div>
  <div class="icon">📱</div>
</div>

<!-- ✅ Suggest -->
<div class="action-card" onclick="openSuggestion()">
  <div class="action-left">
    <span>💡</span>
    <div class="action-info">
      <span class="action-name">Suggest Improvement</span>
      <span class="action-desc">Send feedback</span>
    </div>
  </div>
  <div class="icon">✉️</div>
</div>

<script>

let latitude, longitude, areaName = "";

/* LOCATION */
navigator.geolocation.getCurrentPosition(
  pos => {
    latitude = pos.coords.latitude;
    longitude = pos.coords.longitude;

    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`)
      .then(res => res.json())
      .then(data => {
        areaName = data.address.suburb || data.address.city || "your area";
        document.getElementById("status").innerText = "📍 " + areaName;
      });
  },
  () => {
    document.getElementById("status").innerText = "Enable location";
  }
);

/* SEARCH */
function searchPlaces(type) {
  window.open(`https://www.google.com/maps/search/${type}+near+${areaName}`);
}

/* SHARE */
function sendDirections() {
  const link = `https://www.google.com/maps?q=${latitude},${longitude}`;
  navigator.clipboard.writeText(link);
  alert("Location copied!");
}

/* ✅ OHHPRO */
function openOhhPro() {
  const ua = navigator.userAgent || navigator.vendor || window.opera;

  if (/android/i.test(ua)) {
    window.location.href = "intent://#Intent;package=com.ohhpro.junction;end";

    setTimeout(() => {
      window.location.href =
        "https://play.google.com/store/apps/details?id=com.ohhpro.junction";
    }, 1200);

  } else if (/iPhone|iPad|iPod/i.test(ua)) {
    window.location.href =
      "https://apps.apple.com/in/app/ohhpro-junction/idXXXXXXXX";

  } else {
    window.location.href = "https://ohhpro.com";
  }
}

/* ✅ WHATSAPP */
function openWhatsApp() {
  window.location.href =
    "intent://send/#Intent;scheme=whatsapp;package=com.whatsapp;end;";
}

/* ✅ SUGGEST */
function openSuggestion() {
  window.open("https://forms.gle/YOUR_FORM_LINK");
}

/* ✅ DARK MODE */
function toggleDark() {
  document.body.classList.toggle("dark");
}

</script>

</body>
</html>
