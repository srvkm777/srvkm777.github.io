<!DOCTYPE html>
<html>
<head>
  <title>Utkal Greenex - Yellow Pages</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  #manifest.json

  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 10px;
      padding-bottom: 80px;
      background: #f5f5f5;
      color: #000;
    }

    body.dark {
      background: #121212;
      color: #fff;
    }

    h2 { margin-top: 15px; }
    h3 { margin: 15px 0 5px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card {
      padding: 15px;
      text-align: center;
      border-radius: 12px;
      background: white;
      cursor: pointer;
    }

    body.dark .card {
      background: #1e1e1e;
    }

    .card span {
      display: block;
      font-size: 24px;
    }

    /* CONTACTS */
    .contact-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      background: white;
    }

    body.dark .contact-card {
      background: #1e1e1e;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
    }

    .contact-name { font-weight: bold; }
    .contact-phone { font-size: 12px; color: gray; }

    .call-btn {
      padding: 8px 12px;
      background: #28a745;
      color: white;
      border-radius: 6px;
      text-decoration: none;
    }

    /* BOTTOM NAV */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      border-top: 1px solid #ddd;
      z-index: 1000;
    }

    body.dark .bottom-bar {
      background: #1e1e1e;
      border-top: 1px solid #333;
    }

    .bottom-bar div {
      text-align: center;
      font-size: 12px;
      cursor: pointer;
    }

    .bottom-bar span {
      display: block;
      font-size: 10px;
    }

  </style>
</head>

<body>

<div class="topbar">
  <h2>🏢 Utkal Greenex</h2>
  <button onclick="toggleDark()">🌙</button>
</div>

<p id="status">Detecting location...</p>

<!-- GRID -->
<div class="grid">
  <div class="card" onclick="searchPlaces('hospital')"><span>🏥</span>Hospital</div>
  <div class="card" onclick="searchPlaces('pharmacy')"><span>💊</span>Pharmacy</div>
  <div class="card" onclick="searchPlaces('supermarket')"><span>🛒</span>Grocery</div>
  <div class="card" onclick="searchPlaces('stationery')"><span>📚</span>Stationery</div>
  <div class="card" onclick="searchPlaces('atm')"><span>🏧</span>ATM</div>
  <div class="card" onclick="searchPlaces('24 hour pharmacy')"><span>🌙</span>24x7</div>
  <div class="card" onclick="openApp('swiggy')"><span>🍔</span>Swiggy</div>
  <div class="card" onclick="openApp('zomato')"><span>🍕</span>Zomato</div>
  <div class="card" onclick="sendDirections()"><span>📍</span>Share Loc</div>
</div>

<!-- CONTACTS -->
<h2>📞 Important Contacts</h2>
<div id="contacts"></div>

<script>
let latitude, longitude, areaName = "";

/* CONTACT DATA */
const contacts = [
  {
    category: "🚨 Emergency",
    color: "#ff4d4d",
    items: [
      { name: "Police", phone: "100" },
      { name: "Ambulance", phone: "102" },
      { name: "Fire", phone: "101" }
    ]
  },
  {
    category: "🏢 Apartment",
    color: "#007bff",
    items: [
      { name: "Security", phone: "919900000001" },
      { name: "Maintenance", phone: "919900000002" },
      { name: "Housekeeping", phone: "919900000003" }
    ]
  }
];

/* LOAD CONTACTS */
function loadContacts() {
  const el = document.getElementById("contacts");
  el.innerHTML = "";

  contacts.forEach(group => {
    el.innerHTML += `<h3>${group.category}</h3>`;

    group.items.forEach(c => {
      el.innerHTML += `
        <div class="contact-card" style="border-left:4px solid ${group.color}">
          <div class="contact-info">
            <span class="contact-name">${c.name}</span>
            <span class="contact-phone">${c.phone}</span>
          </div>
          <a class="call📞 Call</a>
        </div>
      `;
    });
  });
}

/* LOCATION */
navigator.geolocation.getCurrentPosition(
  pos => {
    latitude = pos.coords.latitude;
    longitude = pos.coords.longitude;
    getAreaName();
  },
  () => {
    document.getElementById("status").innerText = "Enable location";
  }
);

function getAreaName() {
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`)
    .then(res => res.json())
    .then(data => {
      areaName = data.address.suburb || data.address.city || "your area";
      document.getElementById("status").innerText = "📍 " + areaName;
    });
}

/* SEARCH */
function searchPlaces(type) {
  const url = `https://www.google.com/maps/search/${type}+near+${areaName}`;
  window.open(url);
}

/* ✅ APP OPEN (FIXED) */
function openApp(type) {
  let scheme = "";
  let fallback = "";

  if (type === "uber") {
    scheme = "uber://";
    fallback = "https://m.uber.com";
  } else if (type === "ola") {
    scheme = "olacabs://";
    fallback = "https://book.olacabs.com";
  } else if (type === "swiggy") {
    scheme = "swiggy://";
    fallback = "https://www.swiggy.com";
  } else if (type === "zomato") {
    scheme = "zomato://";
    fallback = "https://www.zomato.com";
  } else if (type === "blinkit") {
    scheme = "blinkit://";
    fallback = "https://blinkit.com";
  } else if (type === "bigbasket") {
    scheme = "bbnow://";
    fallback = "https://www.bigbasket.com";
  }

  window.location.href = scheme;

  setTimeout(() => {
    window.location.href = fallback;
  }, 1200);
}

/* SHARE LOCATION */
function sendDirections() {
  const link = `https://www.google.com/maps?q=${latitude},${longitude}`;
  navigator.clipboard.writeText(link);
  alert("Location copied!");
}

/* DARK MODE */
function toggleDark() {
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", document.body.classList.contains("dark"));
}

if (localStorage.getItem("dark") === "true") {
  document.body.classList.add("dark");
}

/* INIT */
loadContacts();

/* PWA */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

<!-- ✅ BOTTOM NAV -->
<div class="bottom-bar">
  <div onclick="openApp('uber')">🚕<span>Uber</span></div>
  <div onclick="openApp('ola')">🚗<span>Ola</span></div>
  <div onclick="openApp('swiggy')">🍔<span>Swiggy</span></div>
  <div onclick="openApp('zomato')">🍕<span>Zomato</span></div>
  <div onclick="openApp('blinkit')">🛒<span>Blinkit</span></div>
  <div onclick="openApp('bigbasket')">🧺<span>BB</span></div>
</div>

</body>
</html>
