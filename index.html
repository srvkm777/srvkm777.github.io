<!DOCTYPE html>
<html>
<head>
  <title>Utkal Greenex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --green: #2e7d5b;
      --light: #f4f7f5;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--light);
      padding-bottom: 80px;
    }

    body.dark {
      background: #121212;
      color: white;
    }

    /* ✅ HEADER */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #2e7d5b, #3ea97c);
      color: white;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      background: white;
      padding: 4px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
    }

    /* ✅ GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 12px;
    }

    .card {
      background: white;
      padding: 14px;
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
    }

    .card:active { transform: scale(0.95); }

    .card span { font-size: 22px; }
    .card small { display:block; margin-top:6px; }

    h2 {
      padding-left: 12px;
      color: var(--green);
    }

    /* ✅ ACTION */
    .action-card {
      margin: 10px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 16px;
      background: white;
      cursor: pointer;
    }

    .action-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .small-logo {
      width: 30px;
      height: 30px;
    }

    .action-name { font-weight:600; }
    .action-desc { font-size:12px; color:gray; }

    /* ✅ NAV */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      background: white;
      padding: 10px 0;
      border-top: 1px solid #ddd;
    }

    .bottom-bar div {
      text-align: center;
      font-size: 12px;
      cursor: pointer;
    }

    .bottom-bar span {
      display: block;
      font-size: 10px;
    }
  </style>
</head>

<body>

<!-- ✅ HEADER -->
<div class="header">
  <div class="logo-wrap">
    <img src="utkalgreenexlogi.png" class="logo">
    <div class="title">Utkal Greenex</div>
  </div>
  <button onclick="toggleDark()">🌙</button>
</div>

<p id="status" style="padding:10px;">Detecting location...</p>

<!-- ✅ MAIN GRID -->
<div class="grid">
  <div class="card" onclick="searchPlaces('hospital')">🏥<small>Hospital</small></div>
  <div class="card" onclick="searchPlaces('pharmacy')">💊<small>Pharmacy</small></div>
  <div class="card" onclick="searchPlaces('supermarket')">🛒<small>Grocery</small></div>
  <div class="card" onclick="searchPlaces('atm')">🏧<small>ATM</small></div>
</div>

<!-- ✅ SERVICES -->
<h2>📢 Society Services</h2>

<div class="action-card" onclick="openOhhPro()">
  <div class="action-left">
    <img src="ohhpro.png" class="small-logo">
    <div>
      <div class="action-name">OhhPro Junction</div>
      <div class="action-desc">Complaints & emergencies</div>
    </div>
  </div>
</div>

<div class="action-card" onclick="openWhatsApp()">
  <div class="action-left">
    💬
    <div>
      <div class="action-name">WhatsApp Group</div>
    </div>
  </div>
</div>

<!-- ✅ DOCUMENTS -->
<h2>📄 Documents</h2>

<div class="grid">
  <div class="card" onclick="openDoc('docs/bylaws/bylaws.pdf')">📜<small>Bylaws</small></div>
  <div class="card" onclick="openDoc('docs/meetings/2026-may.pdf')">📝<small>May</small></div>
  <div class="card" onclick="openDoc('docs/meetings/2026-june.pdf')">📝<small>June</small></div>
</div>

<script>

let latitude, longitude, areaName="";

/* ✅ LOCATION + AREA */
navigator.geolocation.getCurrentPosition(pos=>{
  latitude = pos.coords.latitude;
  longitude = pos.coords.longitude;

  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`)
    .then(r=>r.json())
    .then(d=>{
      areaName = d.address.suburb || d.address.city || "";
      document.getElementById("status").innerText = "📍 " + areaName;
    });
});

/* ✅ SEARCH WITH LOCATION */
function searchPlaces(type){
  if(areaName){
    window.open(`https://www.google.com/maps/search/${type}+near+${areaName}`);
  } else {
    window.open(`https://www.google.com/maps/search/${type}`);
  }
}

/* ✅ PDF VIEW (NO DOWNLOAD) */
function openDoc(path){
  window.open(path,"_blank");
}

/* ✅ SMART APP OPEN */
function openApp(type){
  const map={
    uber:["uber://","https://m.uber.com"],
    ola:["olacabs://","https://book.olacabs.com"],
    ohhpro:["ohhpro://","https://apps.apple.com/se/app/ohhpro-junction/id1596785670"]
  };

  const [scheme,fallback]=map[type];

  const iframe=document.createElement("iframe");
  iframe.style.display="none";
  iframe.src=scheme;
  document.body.appendChild(iframe);

  setTimeout(()=>{
    if(!document.hidden){
      window.location.href=fallback;
    }
  },1500);
}

function openOhhPro(){openApp("ohhpro");}
function openWhatsApp(){window.location.href="https://wa.me/";}

/* ✅ DARK MODE */
function toggleDark(){
  document.body.classList.toggle("dark");
}

</script>

<!-- ✅ BOTTOM NAV -->
<div class="bottom-bar">
  <div onclick="openApp('uber')">🚕<span>Uber</span></div>
  <div onclick="openApp('ola')">🚗<span>Ola</span></div>
  <div onclick="openApp('ohhpro')">🏢<span>OhhPro</span></div>
</div>

</body>
</html>
